<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F5F7" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./baseline/favicon.svg" />
    <title>实验条件入口</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f4f5f7;
        color: #1c2024;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(100% - 3rem, 34rem);
        padding: 2.5rem;
        border: 1px solid #d9dce1;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1px 2px rgb(16 24 40 / 6%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4b5563;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      ul {
        display: grid;
        gap: 0.65rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border: 1px solid #d9dce1;
        border-radius: 0.65rem;
        color: #1c2024;
        font-size: 0.95rem;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        border-color: #8b929c;
        background: #f8f9fa;
      }
      code {
        color: #6b7280;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>实验条件入口</h1>
      <p>请使用分配给你的条件链接。三个条件使用同一套运行记录，只在证据呈现上不同。</p>
      <ul>
        <li><a href="./baseline/">Baseline<code>/baseline/</code></a></li>
        <li><a href="./candidates/">Candidates<code>/candidates/</code></a></li>
        <li><a href="./probabilities/">Probabilities<code>/probabilities/</code></a></li>
      </ul>
    </main>
  </body>
</html>
